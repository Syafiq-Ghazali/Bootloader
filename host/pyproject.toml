[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "c2000-can-bootloader"
version = "0.1.0"
description = "PCAN client for the TMS320F280039C CAN bootloader"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["python-can[pcan]>=4.6,<5"]

[project.scripts]
canboot = "canboot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
